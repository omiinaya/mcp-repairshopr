version: '3.8'

# Coolify Docker Compose configuration
# Place this file in the ROOT of your repository
# It references the mcp-server subdirectory

services:
  mcp-repairshopr:
    build:
      context: ./mcp-server
      dockerfile: deploy/Dockerfile
    container_name: mcp-repairshopr-server
    # Coolify will override the port mapping with its assigned dynamic port
    ports:
      - "${PORT:-3000}:${PORT:-3000}"  # Health/metrics port
      - "${MCP_HTTP_PORT:-3001}:${MCP_HTTP_PORT:-3001}"  # MCP HTTP transport port

    # Environment variables with Coolify-specific overrides
    environment:
      # Server Configuration
      - SERVER_NAME=${SERVER_NAME:-mcp-repairshopr}
      - SERVER_VERSION=${SERVER_VERSION:-0.1.0}
      # Dynamic port support for Coolify
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}

      # Logging Configuration
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}

      # Cache Configuration
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:-10485760}
      - CACHE_DEFAULT_TTL=${CACHE_DEFAULT_TTL:-300000}
      - CACHE_MAX_ENTRIES=${CACHE_MAX_ENTRIES:-1000}
      - CACHE_ENABLE_WARMING=${CACHE_ENABLE_WARMING:-true}

      # Performance Configuration
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-100}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-30000}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - ENABLE_HOT_RELOAD=${ENABLE_HOT_RELOAD:-false}

      # Data Configuration
      - DATA_DIR=./data
      - CONFIG_DIR=./config
      - METADATA_INDEX_PATH=./data/metadata-index.json

      # Health Check Configuration
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-60000}
      - HEALTH_CHECK_TIMEOUT=${HEALTH_CHECK_TIMEOUT:-5000}

      # Monitoring Configuration
      - MONITORING_ENABLED=${MONITORING_ENABLED:-true}
      - MONITORING_INTERVAL=${MONITORING_INTERVAL:-60000}

      # RepairShopr API Configuration (optional)
      - REPAIRSHOPR_API_KEY=${REPAIRSHOPR_API_KEY:-}
      - REPAIRSHOPR_SUBDOMAIN=${REPAIRSHOPR_SUBDOMAIN:-}
      - REPAIRSHOPR_TIMEOUT_MS=${REPAIRSHOPR_TIMEOUT_MS:-30000}
      - REPAIRSHOPR_RETRY_ATTEMPTS=${REPAIRSHOPR_RETRY_ATTEMPTS:-3}
      - REPAIRSHOPR_RETRY_DELAY_MS=${REPAIRSHOPR_RETRY_DELAY_MS:-1000}

    # Volume mounts for logs persistence only
    # Note: data/ and config/ are baked into the Docker image
    volumes:
      - mcp-logs:/app/logs

    # Automatic restart policy
    restart: unless-stopped

    # Health check optimized for Coolify with curl for reliability
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-3000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # Resource limits for Coolify resource management
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-1.0}'
          memory: '${MEMORY_LIMIT:-512M}'
        reservations:
          cpus: '${CPU_RESERVATION:-0.5}'
          memory: '${MEMORY_RESERVATION:-256M}'

    # Network configuration
    networks:
      - coolify-network

    # Logging configuration for Coolify log management
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volume for logs persistence
volumes:
  mcp-logs:
    driver: local

networks:
  coolify-network:
    driver: bridge
