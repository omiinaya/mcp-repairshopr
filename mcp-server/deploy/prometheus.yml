# Prometheus configuration for MCP RepairShopr monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'mcp-repairshopr'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files
rule_files:
  # - "alert.rules.yml"

# Scrape configurations
scrape_configs:
  # MCP RepairShopr server metrics
  - job_name: 'mcp-repairshopr'
    static_configs:
      - targets: ['mcp-repairshopr:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
